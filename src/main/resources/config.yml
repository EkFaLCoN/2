# ==============================================================
# CursedValleyMobsAndMob
# Sadece asagidaki dunyada calisir (Multiverse'teki ad ile ayni olmali).
# ==============================================================

world: cursedvalley

# Overlord OLDUKTEN kac saat sonra kristal yeniden dogsun
respawn-hours: 3

# Kac saniyede bir can yenilensin (iki boss icin de)
regen-seconds: 10

# --------------------------------------------------------------
# Macro / autoclicker korumasi
# Bu dunyadaki TUM yaratik ve bosslar icin gecerlidir (oyuncular arasi
# vurusa karismaz). Iki vurus arasindaki sureye bakar; beklenen sure
# oyuncunun saldiri hizindan hesaplanir (hiz 4.0 -> 250 ms).
#   0.85 = beklenenin %85'inden hizli vuruslar reddedilir (onerilen)
#   0.60 = cok musamahakar   |   1.00 = cok siki (lag'de yanlis yakalar)
attack-tolerance: 0.85
# Reddedilen vurusta oyuncunun geri savrulma sertligi (0.95 ~ 10 blok)
macro-knockback: 0.95

crystal:
  x: 0
  y: -47
  z: 0
  max-health: 50000
  regen-amount: 200

overlord:
  max-health: 100000
  # 10 saniyede bir yenilenen can
  regen-amount: 200
  # Yakin dovus (Giant'in vanilla saldirisi yok, elle isleniyor)
  # Zirhi delen hasar: buradaki sayi dogrudan cana isler.
  melee-damage: 7        # 3.5 kalp
  melee-reach: 4.0
  melee-cooldown-ticks: 20
  ability:
    interval-seconds: 10
    warn-seconds: 1
    radius: 10
    # Zirhi delen hasar: buradaki sayi dogrudan cana isler.
    damage: 18           # 9 kalp
    # Overlord once bu yukseklige sicrar, sonra yere cakilir; darbe inisde olur.
    jump-height: 10
    # Savurma sertligi carpani (1.0 = cemberin hemen disina, buyugu daha uzaga)
    knockback-multiplier: 2.3

# Droplar komutla eklenir, elle duzenlemene gerek yok:
#   /cvmobs drop add <yaratik> <oran>    (elindeki esya)
#   /cvmobs drop list <yaratik>
# Her esyanin KENDI orani vardir; her biri ayri zar atar.
drops: {}
