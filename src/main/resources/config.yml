# Bu satiri elle degistirme: kod yeni bir surum getirdiginde config
# otomatik yenilenir, eskisi config-eski.yml olarak saklanir.
config-version: 4

# ==============================================================
# CursedValleyMobsAndMob
# Sadece asagidaki dunyada calisir (Multiverse'teki ad ile ayni olmali).
# ==============================================================

world: cursedvalley

# Overlord OLDUKTEN kac saat sonra kristal yeniden dogsun
respawn-hours: 3

# Kac saniyede bir can yenilensin (iki boss icin de)
regen-seconds: 10

# --------------------------------------------------------------
# Macro / autoclicker korumasi
# Bu dunyadaki TUM yaratik ve bosslar icin gecerlidir (oyuncular arasi
# vurusa karismaz). Iki vurus arasindaki sureye bakar; beklenen sure
# oyuncunun saldiri hizindan hesaplanir (hiz 4.0 -> 250 ms).
#   0.85 = beklenenin %85'inden hizli vuruslar reddedilir (onerilen)
#   0.60 = cok musamahakar   |   1.00 = cok siki (lag'de yanlis yakalar)
attack-tolerance: 0.85
# Not: macro vurusunda geri savurma tamamen kaldirildi. Vurus zaten hasar
# vermiyor; oyuncuya sadece uyari gosterilir.

crystal:
  x: 0
  y: -47
  z: 0
  max-health: 50000
  regen-amount: 200

overlord:
  # Ozel model: Giant gorunmez olur, uzerine 7 item_display kemik takilir
  # (cursedvalley:overlord/...). Resourcepack yuklu degilse false yap.
  custom-model: true
  max-health: 100000
  # 10 saniyede bir yenilenen can
  regen-amount: 200
  # Yakin dovus (Giant'in vanilla saldirisi yok, elle isleniyor)
  # Yuvasindan (0/-47/0) bu kadar uzaklastigi AN donus moduna gecer:
  # EVE VARANA KADAR oyunculari tamamen yok sayar, sonra gorusune oyuncu
  # girene kadar yuvasinda bekler. Iki asamada da hizli can yeniler.
  leash-radius: 50
  # Oyuncuyu bu mesafeden fark eder; donus modu da bununla sona erer
  detect-radius: 23
  # Donus modundaki hizli yenilenme (gorusune oyuncu girene kadar surer)
  reset-regen-amount: 600
  reset-regen-seconds: 5
  # Kac saniyede bir hedefini rasgele degistirsin (hep ayni kisiye kilitlenmesin)
  target-switch-seconds: 8
  # Zirhi delen hasar: buradaki sayi dogrudan cana isler.
  # Not: Koruma buyusu MAGIC hasarini da azaltir (tam Koruma IV sette ~%60-70).
  # Bu yuzden sayilar setli oyuncuya gore biraz yuksek tutuldu.
  melee-damage: 14       # setsiz oyuncuyu 2 vurusta dusurur
  melee-reach: 4.0
  melee-cooldown-ticks: 20
  ability:
    interval-seconds: 10
    warn-seconds: 1
    radius: 10
    # Zirhi delen hasar: buradaki sayi dogrudan cana isler.
    damage: 26
    # Overlord once bu yukseklige sicrar, sonra yere cakilir; darbe inisde olur.
    jump-height: 10
    # Savurma sertligi carpani (1.0 = cemberin hemen disina, buyugu daha uzaga)
    knockback-multiplier: 2.3
    # Meteor yagmuru: her 10 saniyede yazi tura -- ya yere cakilma ya bu.
    meteor:
      count-min: 25
      count-max: 25
      # Meteorlarin dusecegi alan yaricapi
      radius: 20
      # Degdigi oyuncuya verilen hasar (patlama yok, blok kirilmaz)
      damage: 13
      # Carptigi oyuncuyu kac tick yaksin (80 tick = 4 saniye)
      fire-ticks: 80
      # Meteorun oyuncuya degme mesafesi ve uyari cemberinin yaricapi
      hit-radius: 2.0
      # Cember gorunduken kac tick sonra dussun (30 tick = 1.5 saniye)
      warn-ticks: 25

    # ---- FAZ YETENEKLERI ----
    # Can barinda %75 / %50 / %25'te turuncu isaretler vardir.
    # Boss o esige indiginde ilgili yetenek BIR KEZ tetiklenir.
    phase:

      # %75 -- Gurz Firtinasi: yerinde doner, yakindakileri savurur.
      # Uzaktakine dokunmaz; dibine yiginmayi cezalandirir.
      storm:
        radius: 8.0
        damage: 18.0
        knockback: 1.7

      # %50 -- Yeraltina Dalis: gomulur, kaybolur, bir oyuncunun altindan
      # patlayarak cikar. Patlama HARITAYA ZARAR VERMEZ (gercek explosion degil).
      dive:
        damage: 22.0
        radius: 4.5

      # %25 -- Mini klonlar. Her 10 saniyede ziplar, r=5 alanda geri iter.
      # Droplari: /cvmobs drop add overlord_clone <oran>
      clones:
        count: 10
        health: 500
        # Yakin dovus hasari
        melee-damage: 5.0
        # Bu kadar uzaktaki oyuncuyu fark eder (Overlord'unki cok daha genis)
        sight-range: 7.0
        # Yurume hizi carpani -- Overlord 1.0, klonlar daha yavas
        speed: 0.75
        # Ziplama darbesi ayrica ayarlanmaz -- overlord.ability.damage ile ayni
        # Rig olcegi (boss 4.0). 1.6 ~ 4.6 blok boy.
        scale: 1.6
        # Overlord'unkinden zayif itis
        knockback: 1.1

  # Kimse gormezse boss kendini toparlar: bu kadar saniye sonra cani %100 olur.
  unseen-reset-seconds: 30

# ==================== LIZARD DRAGON ====================
# Cursed Valley'in ates ejderi. /cvmobs dragon ile cagrilir,
# /cvmobs dragon remove ile kaldirilir.
#
# 0,0 merkezli spawn-radius icinde rasgele bir noktada, hover-height
# kadar yukseklikte belirir.
#
# HARITA KORUMASI: ejderin blok kirmasi, ates topu birakmasi ve zemini
# tutusturmasi tamamen kapali. Tum hasar elle uygulanir.
dragon:
  max-health: 200000
  # 0,0'dan kac blok icinde dogsun
  spawn-radius: 40
  # Zeminden kac blok yukarida belirsin
  hover-height: 14.0
  # Kac saniyede bir yetenek kullansin (can %50 altinda 3 saniye kisalir)
  ability-interval: 9
  regen-amount: 300
  regen-seconds: 10
  # Degdigi oyuncu kac tick yansin
  fire-ticks: 100

  # Alev Nefesi: hedefe dogru koni. Yandan kacilabilir.
  breath:
    damage: 20
    range: 22
    # Koninin yari acisi (derece) -- buyudukce kacmak zorlasir
    angle: 40

  # Ates Yagmuru: gokten dusen alev toplari, once yerde uyari cemberi
  fireball:
    damage: 16
    radius: 3.5
    count: 14

  # Kanat Firtinasi: cevredekileri havalandirip savurur
  gust:
    damage: 12
    radius: 13
    knockback: 2.1

  # Kuyruk Savurma: cok yakindakilere agir hasar, uyarisiz
  tail:
    damage: 24
    radius: 9


