name: RubyMotion
version: '${project.version}'
main: net.mrwqlf.rubymotion.RubyMotion
api-version: '1.21'
description: Ruby datapack hareketini tp yerine sunucu tarafli velocity ile uretir.
author: MRWQLF

commands:
  rubyvel:
    description: Oyuncuya sunucu tarafli hiz uygular (datapack tarafindan cagrilir).
    usage: /rubyvel push <ivme> <tavan> | dash <guc> <yukari> | boost <1-3> | stop
    permission: rubymotion.use

permissions:
  rubymotion.use:
    description: /rubyvel komutunu kullanabilir. Datapack fonksiyonlarindan cagrildigi icin varsayilani true'dur.
    default: true
