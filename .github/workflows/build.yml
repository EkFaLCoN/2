name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4

      - name: Java 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Derle
        run: mvn -B clean package

      - name: Jar'ı yükle
        uses: actions/upload-artifact@v4
        with:
          name: CursedValleyMobsAndMob
          path: target/*.jar
          if-no-files-found: error
